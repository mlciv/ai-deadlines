name: Weekly predicted-deadline update

# Runs a Claude Code pass over the PREDICTED conference entries once a week and
# opens a pull request against gh-pages with whatever it promoted/corrected.
#
# This runs INSIDE the repo, so it has write access via the built-in GITHUB_TOKEN
# (unlike a cloud routine, which cannot push). Claude authenticates with a
# subscription OAuth token — NO Anthropic API key required.
#
# One-time setup:
#   1. Locally run `claude setup-token` and copy the token it prints.
#   2. Repo Settings -> Secrets and variables -> Actions -> New repository secret:
#        name  = CLAUDE_CODE_OAUTH_TOKEN
#        value = <the token>
#   3. Settings -> Actions -> General -> Workflow permissions:
#        - "Read and write permissions" enabled, and
#        - "Allow GitHub Actions to create and approve pull requests" checked.

on:
  schedule:
    # 06:00 UTC every Monday
    - cron: '0 6 * * 1'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-predicted-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Ruby (for jekyll build validation)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Python (for utils/ helper scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps for utils
        run: pip install pyyaml beautifulsoup4 requests

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run predicted-entries sweep
        env:
          # Subscription auth — generated by `claude setup-token`. No API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "/check-predicted" \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch" \
            2>&1 | tee /tmp/claude-run.log

      - name: Validate dataset still builds
        run: |
          ruby -ryaml -rdate -e 'Dir.glob("_data/conferences/*.yml").each{|f| YAML.safe_load(File.read(f),permitted_classes:[Date]) }; puts "YAML OK"'
          bundle exec jekyll build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          base: gh-pages
          branch: auto/weekly-predicted-update
          delete-branch: true
          add-paths: _data/conferences/*.yml
          commit-message: "Weekly predicted-deadline update (automated)"
          title: "Weekly predicted-deadline update — ${{ github.run_id }}"
          body: |
            Automated weekly sweep by Claude Code (`/check-predicted`).

            Verifies every predicted entry against its official CFP and promotes
            the ones now published (dropping the `Predicted` note). **Review the
            diff and the run log before merging.**

            Run log is in the workflow output for this run.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: |
            automated
            deadlines
